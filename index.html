<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuerpo de Cadetes - 2da Cía | ISSP</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --navy-dark: #0b1c36;
      --navy-mid: #16325c;
      --celeste: #009ee3;
      --gold-accent: #b59449;
      --text-main: #111827;
      --text-muted: #475569;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      background-color: #ffffff;
      font-family: "Times New Roman", Times, Georgia, serif;
      color: var(--text-main);
      padding: clamp(48px, 8vh, 85px) clamp(18px, 5vw, 36px) clamp(70px, 12vh, 115px);
      text-align: center;
      position: relative;
      overflow-x: hidden;
    }

    /* Líneas curvas decorativas superior e inferior */
    .curve-top,
    .curve-bottom {
      position: fixed;
      left: 0;
      width: 100%;
      height: clamp(48px, 9vh, 95px);
      pointer-events: none;
      z-index: 1;
    }

    .curve-top {
      top: 0;
    }

    .curve-bottom {
      bottom: 0;
    }

    .curve-top svg,
    .curve-bottom svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Contenedor principal */
    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 0.6s ease-out forwards;
    }

    .logo {
      width: clamp(145px, 38vw, 200px);
      height: auto;
      margin-bottom: clamp(12px, 2.5vh, 18px);
      user-select: none;
    }

    /* Separador ornamental institucional */
    .ornament-divider {
      width: min(85%, 360px);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: clamp(14px, 3vh, 20px);
    }

    .ornament-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-accent), transparent);
    }

    .ornament-diamond {
      width: 7px;
      height: 7px;
      background-color: var(--navy-dark);
      border: 1px solid var(--gold-accent);
      transform: rotate(45deg);
    }

    /* Bloque de jerarquía e información */
    .info-block {
      width: 100%;
      margin-bottom: clamp(22px, 4.5vh, 30px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .unit-title {
      font-size: clamp(1.35rem, 5vw, 1.85rem);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--navy-dark);
      line-height: 1.2;
    }

    .sub-units {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 2px 0;
    }

    .badge {
      background-color: #f8fafc;
      border: 1px solid #cbd5e1;
      border-top: 2px solid var(--navy-mid);
      color: var(--navy-dark);
      font-size: clamp(0.92rem, 3.5vw, 1.08rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 5px 18px;
      border-radius: 3px;
    }

    .chief-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: clamp(0.98rem, 3.8vw, 1.16rem);
      color: #1e293b;
      line-height: 1.4;
      margin-top: 4px;
      padding: 9px 14px;
      border-top: 1px solid #e2e8f0;
      border-bottom: 1px solid #e2e8f0;
      width: 100%;
    }

    .chief-info strong {
      color: var(--navy-dark);
      font-weight: 700;
    }

    /* Barra de progreso */
    .progress-wrapper {
      width: min(100%, 420px);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .progress-track {
      width: 100%;
      height: 5px;
      background-color: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 12px;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.06);
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--navy-dark) 0%, var(--celeste) 100%);
      border-radius: 999px;
      animation: fillBar 3s linear forwards;
    }

    .status-text {
      font-size: clamp(0.92rem, 3.3vw, 1.02rem);
      font-style: italic;
      color: var(--text-muted);
    }

    .status-text span {
      font-style: normal;
      font-weight: 700;
      color: var(--navy-dark);
    }

    /* Crédito discreto de desarrolladores */
    .devs-credit {
      position: fixed;
      bottom: 5px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 0.65rem;
      letter-spacing: 0.04em;
      color: rgba(255, 255, 255, 0.22);
      z-index: 2;
      transition: color 0.3s ease;
    }

    .devs-credit:hover {
      color: rgba(255, 255, 255, 0.75);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fillBar {
      from {
        width: 0%;
      }
      to {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- Curvas superiores institucionales -->
  <div class="curve-top" aria-hidden="true">
    <svg viewBox="0 0 1440 120" preserveAspectRatio="none">
      <path d="M0,0 L1440,0 L1440,42 C1120,108 480,10 0,88 Z" fill="#0b1c36" />
      <path d="M0,88 C480,10 1120,108 1440,42 L1440,54 C1120,118 480,22 0,98 Z" fill="#009ee3" />
      <path d="M0,103 C480,28 1120,122 1440,59" fill="none" stroke="#b59449" stroke-width="2" />
    </svg>
  </div>

  <!-- Contenido central -->
  <main class="container">
    <img src="logo.png" alt="Instituto Superior de Seguridad Pública" class="logo">

    <div class="ornament-divider" aria-hidden="true">
      <span class="ornament-line"></span>
      <span class="ornament-diamond"></span>
      <span class="ornament-line"></span>
    </div>

    <section class="info-block" aria-label="Información institucional">
      <h1 class="unit-title">Cuerpo de Cadetes</h1>

      <div class="sub-units">
        <span class="badge">Promoción XV</span>
        <span class="badge">2da Cía</span>
      </div>

      <div class="chief-info">
        <p>Jefe de Cía: <strong>Principal Santillan</strong></p>
        <p>Subjefe de Cía: <strong>Principal Hadicke</strong></p>
      </div>
    </section>

    <div class="progress-wrapper">
      <div class="progress-track" aria-hidden="true">
        <div class="progress-fill"></div>
      </div>

      <p class="status-text">
        Redirigiendo al sistema en <span id="countdown">3</span> segundos...
      </p>
    </div>
  </main>

  <footer class="devs-credit">
    Devs: Suarez Ciro · Herrera Dylan · Novio Leandro
  </footer>

  <!-- Curvas inferiores institucionales -->
  <div class="curve-bottom" aria-hidden="true">
    <svg viewBox="0 0 1440 120" preserveAspectRatio="none">
      <path d="M0,78 C320,12 960,110 1440,32 L1440,120 L0,120 Z" fill="#0b1c36" />
      <path d="M0,66 C320,2 960,98 1440,22 L1440,32 C960,110 320,12 0,78 Z" fill="#009ee3" />
      <path d="M0,61 C320,-2 960,92 1440,17" fill="none" stroke="#b59449" stroke-width="2" />
    </svg>
  </div>

  <script>
    (function () {
      const targetUrl = "https://docs.google.com/spreadsheets/d/1cZx3Fa4uwpzvPpj_Q1aksVRZjwL-IqRM_kiN-nNF3Kc/edit?usp=sharing";
      const countdownEl = document.getElementById("countdown");
      let secondsLeft = 3;

      const interval = setInterval(() => {
        secondsLeft -= 1;
        if (secondsLeft >= 0 && countdownEl) {
          countdownEl.textContent = secondsLeft;
        }
        if (secondsLeft <= 0) {
          clearInterval(interval);
        }
      }, 1000);

      setTimeout(() => {
        window.location.href = targetUrl;
      }, 3000);//SUAREZ
    })();
  </script>
</body>
</html>
